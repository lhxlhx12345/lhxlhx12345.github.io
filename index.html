<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人博客</title>
  <meta name="description" content="使用纯静态 HTML + Tailwind CDN 的个人博客" />
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Optional: customize Tailwind (e.g., dark mode) -->
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
  <header class="bg-gray-100 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-4">
    <nav class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold"><a href="/" class="hover:underline">个人博客</a></h1>
      <div class="flex space-x-4">
        <!-- Add navigation items as needed -->
        <a href="#" class="text-gray-600 dark:text-gray-300 hover:text-blue-600">首页</a>
        <a href="#" class="text-gray-600 dark:text-gray-300 hover:text-blue-600">关于</a>
        <a href="#" class="text-gray-600 dark:text-gray-300 hover:text-blue-600">联系</a>
      </div>
    </nav>
  </header>

  <main class="flex-1 container mx-auto p-4">
    <section class="my-8">
      <h2 class="text-3xl font-semibold mb-4">欢迎来到我的个人博客</h2>
      <p class="text-lg">这里是基于纯 HTML + Tailwind CDN 的简洁站点，可随时添加新栏目和内容。</p>
    </section>
    <!-- 示例内容块 -->
    <section class="grid md:grid-cols-2 gap-6">
      <article class="p-4 border rounded hover:shadow-lg transition-shadow">
        <h3 class="text-xl font-bold mb-2">文章标题 1</h3>
        <p class="text-sm text-gray-600 dark:text-gray-400">摘要内容……</p>
        <a href="#" class="text-blue-600 dark:text-blue-400 hover:underline mt-2 block">阅读更多 →</a>
      </article>
      <article class="p-4 border rounded hover:shadow-lg transition-shadow">
        <h3 class="text-xl font-bold mb-2">文章标题 2</h3>
        <p class="text-sm text-gray-600 dark:text-gray-400">摘要内容……</p>
        <a href="#" class="text-blue-600 dark:text-blue-400 hover:underline mt-2 block">阅读更多 →</a>
      </article>
    </section>
  </main>

  <footer class="bg-gray-100 dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 p-4 text-center text-sm">
    © 2026 LHX. All rights reserved.
  </footer>
</body>
</html>
