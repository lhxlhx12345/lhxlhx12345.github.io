<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="个人博客 — 技术分享与思考">
    <meta name="theme-color" content="#0a0a0f">

    <!-- Open Graph -->
    <meta property="og:title" content="CARBlog">
    <meta property="og:description" content="一个专注于技术探索与内容创作的个人空间。">
    <meta property="og:type" content="website">

    <title>CARBlog</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0a0a0f',
                    },
                    fontFamily: {
                        sans: ['"Inter"', 'system-ui', '-apple-system', '"Segoe UI"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', '"Fira Code"', 'monospace'],
                    },
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .text-balance { text-wrap: balance; }
        }
    </style>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-[#0a0a0f] text-white font-sans antialiased min-h-screen flex flex-col overflow-x-hidden">

    <!-- Particle background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Loader -->
    <div id="loader" class="fixed inset-0 z-[100] bg-[#0a0a0f] flex flex-col items-center justify-center gap-4 transition-opacity duration-500">
        <div class="relative w-12 h-12">
            <div class="absolute inset-0 border-2 border-purple-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-2 border-t-purple-400 border-r-transparent border-b-transparent border-l-transparent rounded-full animate-spin"></div>
        </div>
        <span class="text-white/30 text-xs tracking-[0.3em] uppercase">Loading</span>
    </div>

    <!-- Navbar -->
    <header id="navbar-container" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300">
    </header>

    <!-- Sidebar backdrop -->
    <div id="sidebar-backdrop"
         class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 lg:hidden">
    </div>

    <!-- Sidebar -->
    <aside id="sidebar-container"
           class="fixed top-16 left-0 z-40 w-72 h-[calc(100vh-4rem)] overflow-y-auto
                  transform -translate-x-full lg:translate-x-0
                  transition-transform duration-300 ease-in-out
                  bg-[#0a0a0f]/95 backdrop-blur-md border-r border-white/[0.06]
                  [&::-webkit-scrollbar]:w-1">
    </aside>

    <!-- Main content -->
    <main id="main-content" class="relative z-10 flex-1 pt-16 transition-all duration-300">
        <!-- 页面内容由 app.js 加载 -->
    </main>

    <!-- Footer -->
    <footer id="footer-container" class="relative z-10">
    </footer>

    <!-- Scripts -->
    <script src="assets/js/anim.js"></script>
    <script src="assets/js/routes.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
